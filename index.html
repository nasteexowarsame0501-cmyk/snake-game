<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>


    <link rel="stylesheet" href="style.css">


      <button> START </button>
      <button> PAUSE </button>
      <button> RESUME </button>
      <button> RESTART </button>
      <p id="Score">Score: 0</p>



      <script>
        const startButton = document.querySelector("button:nth-of-type(1)");
        const pauseButton = document.querySelector("button:nth-of-type(2)");
        const resumeButton = document.querySelector("button:nth-of-type(3)");
        const restartButton = document.querySelector("button:nth-of-type(4)");

        let gameInterval;
        const moveInterval = 110;

        startButton.addEventListener("click", () => {
            if (!gameInterval) {
                gameInterval = setInterval(moveSnakeWithFood, moveInterval);
            }
        });

        pauseButton.addEventListener("click", () => {
            clearInterval(gameInterval);
            gameInterval = null;
        });

        resumeButton.addEventListener("click", () => {
            if (!gameInterval) {
                gameInterval = setInterval(moveSnakeWithFood, moveInterval);
            }
        });

        restartButton.addEventListener("click", () => {
            clearInterval(gameInterval);
            gameInterval = null;
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            score = 0;
            document.getElementById("Score").textContent = "Score: " + score;
            safePlaceFood();
            drawGame();
        });


      </script>


    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };


        //BUILIDNG THE GAME FROM HERE ONWARDS

        
        //create random food positions 
        const placeFood = () => {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        };

        const safePlaceFood = () => {
            placeFood();
            while (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                placeFood();
            }
        };

      //snake movemens with food and update score
        const moveSnakeWithFood = () => {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if(checkGameOver(head) || checkHitSelf(head)) {
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                alert("Score: " + score);
                safePlaceFood();
            } else {
                snake.pop();
            }

            drawGame();
        };



          //keyboard control for snake movement
         document.addEventListener("keydown", (event) => {
            switch (event.key) {
                case "ArrowUp":
                    if (direction.y === 0) direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) direction = { x: 1, y: 0 };
                    break;
            }
        });



        //game over segment where: 
  
        
        //hitting the wall = ends the game 
        const checkGameOver = (head) => {
            const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
            if (hitWall) {
                clearInterval(gameInterval);
                alert("Game Over! Your score: " + score);
                return true;
            }
            return false;
        }

        //if snake hits itself = ends the game
          const checkHitSelf = (head) => {
            const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);
            if (hitSelf) {
                clearInterval(gameInterval);
                alert("Game Over! Your score: " + score);
                return true;
            } 
        
            return false;
        }; 
                


        //interval that moves the snake every 100 milliseconds
        const moveSnake = () => {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            snake.unshift(head);
            snake.pop();
            drawGame();
        };

        drawGame();
        safePlaceFood();
        

    </script>

</body>
</html>
